句子挖空、字词挖空、反向默写、自定义挖空四种模式共用同一套判分：标点、全半角、大小写与数字小数点都有容错。=Sentence cloze, word cloze, reverse dictation and custom cloze share one scorer with tolerance for punctuation, full/half-width forms, case and decimal points.
