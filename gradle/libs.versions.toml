[versions]
kotlin = "2.2.20"
compose = "1.10.3"
coroutines = "1.10.2"
json = "20240303"
junit5 = "5.11.4"
junit4 = "4.13.2"
pdfbox = "3.0.4"
poi = "5.3.0"
logback = "1.5.16"
jna = "5.15.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
org-json = { module = "org.json:json", version.ref = "json" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.11.4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine", version.ref = "junit5" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
apache-poi = { module = "org.apache.poi:poi", version.ref = "poi" }
apache-poi-scratchpad = { module = "org.apache.poi:poi-scratchpad", version.ref = "poi" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
